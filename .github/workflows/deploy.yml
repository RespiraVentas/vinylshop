name: Deploy vinyl catalog

on:
  push:
    branches: [main]
    # Sin filtro de rutas a proposito: cualquier cambio en main republica el
    # sitio. Antes habia una lista de archivos y las carpetas nuevas (disco/,
    # ficha.css, los sitemaps) no matcheaban, asi que el deploy no se disparaba
    # y los cambios quedaban subidos a GitHub pero nunca publicados.
  workflow_dispatch:   # permite correrlo manualmente desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."          # sube todo el repo como sitio estático

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
